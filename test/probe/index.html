<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geolocation Probe</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.6 system-ui, sans-serif; max-width: 820px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.sub { color: #777; margin: 0 0 20px; }
  section { border: 1px solid #8884; border-radius: 10px; padding: 12px 16px; margin: 0 0 14px; }
  h2 { font-size: 14px; margin: 0 0 8px; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 3px 8px 3px 0; vertical-align: top; }
  td:first-child { color: #777; width: 170px; }
  code, .mono { font-family: ui-monospace, Consolas, monospace; }
  .ok { color: #1a7f37; font-weight: 600; }
  .bad { color: #c0362c; font-weight: 600; }
  #log { max-height: 180px; overflow: auto; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid #8886; background: transparent; color: inherit; cursor: pointer; }
</style>
</head>
<body>
<h1>Geolocation Probe</h1>
<p class="sub">Calls navigator.geolocation only. No third-party location logic.</p>

<section>
  <h2>getCurrentPosition</h2>
  <table id="pos"><tr><td>Status</td><td>Requesting…</td></tr></table>
  <p><button id="again">Get again</button></p>
</section>

<section>
  <h2>watchPosition (live; should change as soon as you move the point)</h2>
  <div id="log">Waiting for first callback…</div>
</section>

<section>
  <h2>Consistency checks</h2>
  <table id="checks"><tr><td>Checking…</td><td></td></tr></table>
</section>

<script>
const $ = (id) => document.getElementById(id);
const row = (k, v, cls) => `<tr><td>${k}</td><td class="${cls || 'mono'}">${v}</td></tr>`;
let last = null;

function showPos(p) {
  last = p;
  const c = p.coords;
  $('pos').innerHTML =
    row('Latitude', c.latitude) + row('Longitude', c.longitude) +
    row('Accuracy', c.accuracy + ' m') +
    row('Altitude', c.altitude === null ? 'null' : c.altitude) +
    row('Timestamp', new Date(p.timestamp).toLocaleString()) +
    row('Object type', (p instanceof GeolocationPosition ? 'GeolocationPosition' : 'Not native type ← detectable') ,
        p instanceof GeolocationPosition ? 'ok' : 'bad') +
    row('Map', `<a href="https://www.openstreetmap.org/?mlat=${c.latitude}&mlon=${c.longitude}#map=16/${c.latitude}/${c.longitude}" target="_blank">View on OSM</a>`, '');
  checks();
}

function showErr(e) {
  $('pos').innerHTML = row('Error', `${e.code} — ${e.message}`, 'bad');
}

const get = () => navigator.geolocation.getCurrentPosition(showPos, showErr, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
get();
$('again').onclick = get;

navigator.geolocation.watchPosition((p) => {
  const line = document.createElement('div');
  line.textContent = `${new Date().toLocaleTimeString()}  ${p.coords.latitude}, ${p.coords.longitude}  ±${p.coords.accuracy}m`;
  if ($('log').textContent.startsWith('Waiting')) $('log').textContent = '';
  $('log').prepend(line);
}, (e) => { $('log').textContent = `watch error: ${e.code} ${e.message}`; });

// Cross-check what else the page can see about where you are
async function checks() {
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  let out = row('Function source', navigator.geolocation.getCurrentPosition.toString(),
    navigator.geolocation.getCurrentPosition.toString().includes('[native code]') ? 'mono' : 'bad');
  out += row('Time zone', tz);
  try {
    const st = await navigator.permissions.query({ name: 'geolocation' });
    out += row('Permission', st.state);
  } catch {}
  $('checks').innerHTML = out;
  try {
    const ip = await (await fetch('https://ipinfo.io/json')).json();
    const [ilat, ilng] = ip.loc.split(',').map(Number);
    let extra = row('IP address', ip.ip) + row('IP location', `${ip.city}, ${ip.region} (${ip.loc})`);
    if (last) {
      const d = Math.hypot(last.coords.latitude - ilat, (last.coords.longitude - ilng) * Math.cos(ilat * Math.PI / 180)) * 111.32;
      extra += row('Distance from GPS fix', `${d.toFixed(0)} km`, d > 100 ? 'bad' : 'mono');
    }
    $('checks').innerHTML += extra;
  } catch {}
}
</script>
</body>
</html>
