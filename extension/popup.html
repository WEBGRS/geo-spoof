<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>Geo Spoof</strong>
    <label class="switch"><input type="checkbox" id="enabled"><span></span></label>
    <span id="state" data-i18n="stateOff">Off</span>
  </header>

  <p id="err" hidden></p>

  <form id="searchForm">
    <input id="q" data-i18n-placeholder="searchPlaceholder">
    <button data-i18n="search">Search</button>
  </form>
  <ul id="results"></ul>

  <div id="map"></div>

  <div class="grid">
    <label><span data-i18n="lat">Latitude</span><input id="lat" type="number" step="any"></label>
    <label><span data-i18n="lng">Longitude</span><input id="lng" type="number" step="any"></label>
    <label><span data-i18n="accuracy">Accuracy (m)</span><input id="accuracy" type="number" min="1" value="20"></label>
    <label><span data-i18n="altitude">Altitude (m)</span><input id="altitude" type="number" step="any" data-i18n-placeholder="altitudePlaceholder"></label>
  </div>
  <label class="check"><input type="checkbox" id="jitter"> <span data-i18n="jitter">Random jitter on each fix</span></label>

  <div class="row">
    <button id="save" class="primary" data-i18n="apply">Apply</button>
    <button id="fav" data-i18n="saveFav">Save as favorite</button>
  </div>
  <ul id="favs"></ul>
  <p class="hint" data-i18n="hint"></p>

  <script src="lib/leaflet.js"></script>
  <script src="popup.js"></script>
</body>
</html>
